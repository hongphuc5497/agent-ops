name: Release

# Push a vX.Y.Z tag → this workflow runs the full test suite, publishes to
# npm with the correct dist-tag (latest for forward releases, previous for
# backfills, next for pre-releases), and creates/updates the matching
# GitHub release with notes extracted from CHANGELOG.md.
#
# Pre-flight checks abort if the tag and package.json disagree on the
# version — the most common shipping mistake.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write   # required to create GitHub releases
  id-token: write   # required for npm Trusted Publishing (OIDC) — no token secret needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # so we can write notes that reference history

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing requires npm CLI 11.5.1+. Node 20 ships with npm
      # 10.x, so bump the CLI before publishing. The bump is local to this
      # runner and does not affect anything else.
      - name: Upgrade npm for Trusted Publishing support
        run: npm install -g npm@latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Pre-release suffix? Anything with a dash after the patch.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Run full test suite
        run: npm test

      - name: Determine npm dist-tag
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            echo "name=next" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT_LATEST="$(npm view @hongphuc5497/agent-ops dist-tags.latest 2>/dev/null || echo '0.0.0')"
          # Lexicographically pick the higher of (latest, version) using -V sort.
          HIGHER="$(printf '%s\n%s\n' "$CURRENT_LATEST" "$VERSION" | sort -V | tail -1)"
          if [[ "$HIGHER" == "$VERSION" ]]; then
            echo "name=latest" >> "$GITHUB_OUTPUT"
          else
            echo "name=previous" >> "$GITHUB_OUTPUT"
          fi

      # No token, no secret. npm CLI 11.5+ mints a short-lived OIDC token
      # from GitHub's identity provider and presents it to the npm registry,
      # which validates the (repo, workflow, ref) triple against the package's
      # Trusted Publisher configuration on npmjs.com.
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --access public --tag "${{ steps.tag.outputs.name }}"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          bash scripts/extract-changelog.sh "$VERSION" > "$NOTES_FILE"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "No matching section in CHANGELOG.md — using a minimal note." >&2
            echo "Release of v$VERSION. See CHANGELOG.md for details." > "$NOTES_FILE"
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="$TAG"
          NOTES_FILE="${{ steps.notes.outputs.file }}"
          LATEST_FLAG=""
          if [[ "${{ steps.tag.outputs.name }}" == "latest" ]]; then
            LATEST_FLAG="--latest"
          fi
          PRERELEASE_FLAG=""
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # If the release already exists (e.g., retag), update it; otherwise create.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES_FILE" $LATEST_FLAG $PRERELEASE_FLAG
          else
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" $LATEST_FLAG $PRERELEASE_FLAG
          fi
